# The dev database is the shared Postgres server in .env (DATABASE_URL, database `neno`).
# `postgres` here is an optional fully-local fallback: `docker compose --profile localdb up -d postgres`
# and point DATABASE_URL at postgres://neno:neno@localhost:5432/neno?sslmode=disable.
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-neno}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-nenodevsecret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  postgres:
    profiles: [localdb]
    image: postgres:14 # matches the shared server's major version
    environment:
      POSTGRES_USER: neno
      POSTGRES_PASSWORD: neno
      POSTGRES_DB: neno
    ports: ["5432:5432"]
    volumes: [pg:/var/lib/postgresql/data]

volumes:
  minio:
  pg:
